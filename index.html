<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%2338bdf8'>⚡</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Om Pawar — Software Engineer & Frontend Developer</title>
    <meta name="description" content="Portfolio of Om Pawar — Software Engineer & Frontend Developer specializing in React, C++, modern UI systems, and AI-powered web applications." />
    <meta name="keywords" content="Om Pawar, Frontend Developer, Software Engineer, React, Three.js, C++, Web Development, Voke AI" />
    <meta name="author" content="Om Pawar" />
    <meta name="theme-color" content="#050505" />

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('portfolio_theme');
          var isDark = saved ? saved === 'dark' : true;
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>

    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Plus Jakarta Sans & Cormorant Garamond & JetBrains Mono -->
